[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opentrain"
version = "0.1.0.dev0"
description = "The open harness for training models. First feature: a personal coding model from your agent sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
opentrain = "opentrain.cli:main"
ot = "opentrain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
