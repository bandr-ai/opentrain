[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opentrain"
version = "0.2.0.dev0"
description = "The open harness for training models. First feature: a personal coding model from your agent sessions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["post-training", "fine-tuning", "lora", "coding-agents", "continual-learning", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Trainer backends. The core is stdlib only; each backend imports its SDK lazily.
tinker = ["tinker>=0.40", "tinker-cookbook>=0.7.1"]
local = ["torch>=2.4", "transformers>=4.57", "peft>=0.13", "trl>=1.18", "datasets>=4.7"]
serve-local = ["vllm"]  # Linux + CUDA only
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
opentrain = "opentrain.cli:main"
ot = "opentrain.cli:main"

[project.urls]
Source = "https://github.com/bandr-ai/open-train"

[tool.hatch.build.targets.wheel]
packages = ["src/opentrain"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "opentrain/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
